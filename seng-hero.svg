<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="500"
  viewBox="0 0 1000 500"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Seng Chhunsour animated developer banner</title>

  <desc id="description">
    Animated profile banner for Seng Chhunsour, a full-stack developer,
    product builder, and UI UX designer based in Cambodia.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020713"/>
      <stop offset="48%" stop-color="#06214E"/>
      <stop offset="100%" stop-color="#071326"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FC6E00"/>
      <stop offset="48%" stop-color="#FF9B4E"/>
      <stop offset="100%" stop-color="#FC6E00"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#FC6E00" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#FC6E00" stop-opacity="0"/>
    </radialGradient>

    <pattern
      id="grid"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M32 0H0V32"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity=".035"
        stroke-width="1"
      />
    </pattern>

    <filter
      id="softGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur stdDeviation="7" result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="terminalClip">
      <rect
        x="145"
        y="338"
        width="710"
        height="105"
        rx="18"
      />
    </clipPath>
  </defs>

  <style>
    .sans {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .mono {
      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;
    }

    .orbit-one {
      transform-origin: 500px 215px;
      animation: orbitOne 18s linear infinite;
    }

    .orbit-two {
      transform-origin: 500px 215px;
      animation: orbitTwo 24s linear infinite reverse;
    }

    .float-one {
      animation: floatOne 5s ease-in-out infinite;
    }

    .float-two {
      animation: floatTwo 6.5s ease-in-out infinite;
    }

    .status-dot {
      transform-origin: center;
      animation: statusPulse 2s ease-in-out infinite;
    }

    .name-glow {
      animation: nameGlow 4s ease-in-out infinite;
    }

    .role-one {
      animation: roleOne 9s ease-in-out infinite;
    }

    .role-two {
      animation: roleTwo 9s ease-in-out infinite;
    }

    .role-three {
      animation: roleThree 9s ease-in-out infinite;
    }

    .terminal-line-one {
      animation: terminalOne 6s ease-in-out infinite;
    }

    .terminal-line-two {
      animation: terminalTwo 6s ease-in-out infinite;
    }

    .terminal-line-three {
      animation: terminalThree 6s ease-in-out infinite;
    }

    .cursor {
      animation: cursorBlink 1s steps(2, start) infinite;
    }

    .scan-line {
      animation: scanLine 4.5s ease-in-out infinite;
    }

    .bottom-signal {
      stroke-dasharray: 12 16;
      animation: signalMove 9s linear infinite;
    }

    @keyframes orbitOne {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes orbitTwo {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes floatOne {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes floatTwo {
      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(10px, 8px);
      }
    }

    @keyframes statusPulse {
      0%,
      100% {
        opacity: .55;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.25);
      }
    }

    @keyframes nameGlow {
      0%,
      100% {
        opacity: .92;
      }

      50% {
        opacity: 1;
        filter: drop-shadow(0 0 10px rgba(252, 110, 0, .45));
      }
    }

    @keyframes roleOne {
      0%,
      27% {
        opacity: 1;
        transform: translateY(0);
      }

      32%,
      94% {
        opacity: 0;
        transform: translateY(-10px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes roleTwo {
      0%,
      29% {
        opacity: 0;
        transform: translateY(10px);
      }

      35%,
      60% {
        opacity: 1;
        transform: translateY(0);
      }

      66%,
      100% {
        opacity: 0;
        transform: translateY(-10px);
      }
    }

    @keyframes roleThree {
      0%,
      62% {
        opacity: 0;
        transform: translateY(10px);
      }

      68%,
      93% {
        opacity: 1;
        transform: translateY(0);
      }

      99%,
      100% {
        opacity: 0;
        transform: translateY(-10px);
      }
    }

    @keyframes terminalOne {
      0%,
      15% {
        opacity: 0;
        transform: translateX(-10px);
      }

      22%,
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes terminalTwo {
      0%,
      35% {
        opacity: 0;
        transform: translateX(-10px);
      }

      42%,
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes terminalThree {
      0%,
      55% {
        opacity: 0;
        transform: translateX(-10px);
      }

      62%,
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes cursorBlink {
      50% {
        opacity: 0;
      }
    }

    @keyframes scanLine {
      0% {
        transform: translateY(-110px);
        opacity: 0;
      }

      20% {
        opacity: .32;
      }

      80% {
        opacity: .18;
      }

      100% {
        transform: translateY(110px);
        opacity: 0;
      }
    }

    @keyframes signalMove {
      to {
        stroke-dashoffset: -280;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>

  <!-- Main background -->

  <rect
    width="1000"
    height="500"
    rx="30"
    fill="url(#background)"
  />

  <rect
    width="1000"
    height="500"
    rx="30"
    fill="url(#grid)"
  />

  <!-- Background glow -->

  <circle
    cx="100"
    cy="450"
    r="260"
    fill="url(#glow)"
    opacity=".45"
  />

  <circle
    cx="900"
    cy="40"
    r="280"
    fill="url(#glow)"
  />

  <!-- Orbit decorations -->

  <g class="orbit-one">
    <circle
      cx="500"
      cy="52"
      r="5"
      fill="#FC6E00"
      filter="url(#softGlow)"
    />
  </g>

  <g class="orbit-two">
    <circle
      cx="500"
      cy="72"
      r="3.5"
      fill="#FFFFFF"
      opacity=".7"
    />
  </g>

  <circle
    cx="500"
    cy="215"
    r="166"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity=".045"
  />

  <circle
    cx="500"
    cy="215"
    r="143"
    fill="none"
    stroke="#FC6E00"
    stroke-opacity=".08"
    stroke-dasharray="6 18"
  />

  <!-- Floating particles -->

  <g class="float-one">
    <circle
      cx="114"
      cy="105"
      r="6"
      fill="#FC6E00"
      opacity=".9"
      filter="url(#softGlow)"
    />

    <circle
      cx="146"
      cy="136"
      r="3"
      fill="#FFFFFF"
      opacity=".55"
    />
  </g>

  <g class="float-two">
    <circle
      cx="876"
      cy="118"
      r="5"
      fill="#FC6E00"
      opacity=".75"
    />

    <circle
      cx="900"
      cy="151"
      r="3"
      fill="#FFFFFF"
      opacity=".45"
    />
  </g>

  <!-- Location badge -->

  <g
    class="sans"
    transform="translate(355 54)"
  >
    <rect
      width="290"
      height="42"
      rx="21"
      fill="#FFFFFF"
      fill-opacity=".065"
      stroke="#FFFFFF"
      stroke-opacity=".07"
    />

    <circle
      class="status-dot"
      cx="24"
      cy="21"
      r="6"
      fill="#FC6E00"
    />

    <text
      x="43"
      y="27"
      fill="#DCE6F5"
      font-size="15"
      font-weight="700"
      letter-spacing="1.8"
    >
      PHNOM PENH • CAMBODIA
    </text>
  </g>

  <!-- Name -->

  <g
    class="sans"
    text-anchor="middle"
  >
    <text
      x="500"
      y="176"
      fill="#FFFFFF"
      font-size="69"
      font-weight="800"
      letter-spacing="-2"
    >
      SENG
    </text>

    <text
      class="name-glow"
      x="500"
      y="245"
      fill="url(#accent)"
      font-size="69"
      font-weight="800"
      letter-spacing="-2"
    >
      CHHUNSOUR
    </text>

    <text
      x="500"
      y="284"
      fill="#9FB0C9"
      font-size="22"
      font-weight="500"
      letter-spacing=".35"
    >
      Building polished digital products from idea to deployment.
    </text>

    <!-- Rotating roles -->

    <g transform="translate(500 322)">
      <text
        class="role-one"
        text-anchor="middle"
        fill="#FFFFFF"
        font-size="23"
        font-weight="700"
        letter-spacing="3"
      >
        FULL-STACK DEVELOPER
      </text>

      <text
        class="role-two"
        text-anchor="middle"
        fill="#FFFFFF"
        font-size="23"
        font-weight="700"
        letter-spacing="3"
      >
        PRODUCT BUILDER
      </text>

      <text
        class="role-three"
        text-anchor="middle"
        fill="#FFFFFF"
        font-size="23"
        font-weight="700"
        letter-spacing="3"
      >
        UI/UX DESIGNER
      </text>
    </g>
  </g>

  <!-- Terminal -->

  <g class="mono">
    <rect
      x="125"
      y="350"
      width="750"
      height="105"
      rx="18"
      fill="#030914"
      fill-opacity=".91"
      stroke="#FFFFFF"
      stroke-opacity=".12"
    />

    <circle
      cx="153"
      cy="372"
      r="5"
      fill="#FC6E00"
    />

    <circle
      cx="172"
      cy="372"
      r="5"
      fill="#FC6E00"
      opacity=".5"
    />

    <circle
      cx="191"
      cy="372"
      r="5"
      fill="#FC6E00"
      opacity=".22"
    />

    <text
      x="217"
      y="378"
      fill="#7185A4"
      font-size="15"
    >
      seng@product-lab
    </text>

    <path
      d="M125 390H875"
      stroke="#FFFFFF"
      stroke-opacity=".075"
    />

    <g clip-path="url(#terminalClip)">
      <rect
        class="scan-line"
        x="125"
        y="390"
        width="750"
        height="36"
        fill="url(#glow)"
        opacity=".2"
      />

      <g class="terminal-line-one">
        <text
          x="160"
          y="418"
          fill="#FC6E00"
          font-size="17"
        >
          $
        </text>

        <text
          x="183"
          y="418"
          fill="#E4ECF8"
          font-size="17"
        >
          shipping Telegram Mini Apps
        </text>
      </g>

      <g class="terminal-line-two">
        <text
          x="470"
          y="418"
          fill="#FC6E00"
          font-size="17"
        >
          •
        </text>

        <text
          x="495"
          y="418"
          fill="#E4ECF8"
          font-size="17"
        >
          SaaS
        </text>
      </g>

      <g class="terminal-line-three">
        <text
          x="585"
          y="418"
          fill="#FC6E00"
          font-size="17"
        >
          •
        </text>

        <text
          x="610"
          y="418"
          fill="#E4ECF8"
          font-size="17"
        >
          Business Systems
        </text>
      </g>

      <rect
        class="cursor"
        x="820"
        y="404"
        width="9"
        height="18"
        rx="1"
        fill="#FC6E00"
      />
    </g>
  </g>

  <!-- Bottom moving signal -->

  <path
    class="bottom-signal"
    d="M45 476H255L277 459L300 487L325 449L350 476H955"
    fill="none"
    stroke="url(#accent)"
    stroke-width="2"
    stroke-linecap="round"
    opacity=".7"
  />
</svg>
