<svg
xmlns="http://www.w3.org/2000/svg"
width="1200"
height="360"
viewBox="0 0 1200 360"
role="img"
aria-labelledby="title description"

>

  <title id="title">Seng Chhunsour animated developer banner</title>
  <desc id="description">
    Animated profile banner for Seng Chhunsour, a full-stack developer and product builder in Cambodia.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="52%" stop-color="#06214E"/>
      <stop offset="100%" stop-color="#09162D"/>
    </linearGradient>

```
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#FC6E00"/>
  <stop offset="50%" stop-color="#FF9A45"/>
  <stop offset="100%" stop-color="#FC6E00"/>
</linearGradient>

<radialGradient id="orangeGlow">
  <stop offset="0%" stop-color="#FC6E00" stop-opacity=".32"/>
  <stop offset="100%" stop-color="#FC6E00" stop-opacity="0"/>
</radialGradient>

<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path
    d="M 32 0 L 0 0 0 32"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity=".035"
    stroke-width="1"
  />
</pattern>

<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="7" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<clipPath id="terminalClip">
  <rect x="744" y="74" width="374" height="216" rx="14"/>
</clipPath>
```

  </defs>

  <style>
    .sans {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    .float-one {
      animation: floatOne 5s ease-in-out infinite;
    }

    .float-two {
      animation: floatTwo 6.5s ease-in-out infinite;
    }

    .pulse {
      transform-origin: center;
      animation: pulse 2s ease-in-out infinite;
    }

    .cursor {
      animation: blink 1s steps(2, start) infinite;
    }

    .scan {
      animation: scan 4.5s ease-in-out infinite;
    }

    .signal {
      stroke-dasharray: 9 13;
      animation: signal 8s linear infinite;
    }

    .role-one {
      animation: roleOne 9s ease-in-out infinite;
    }

    .role-two {
      animation: roleTwo 9s ease-in-out infinite;
    }

    .role-three {
      animation: roleThree 9s ease-in-out infinite;
    }

    .terminal-one {
      animation: terminalOne 6s ease-in-out infinite;
    }

    .terminal-two {
      animation: terminalTwo 6s ease-in-out infinite;
    }

    .terminal-three {
      animation: terminalThree 6s ease-in-out infinite;
    }

    @keyframes floatOne {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-13px); }
    }

    @keyframes floatTwo {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(10px, 8px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: .55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.22); }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes scan {
      0% { transform: translateY(-235px); opacity: 0; }
      18% { opacity: .45; }
      82% { opacity: .2; }
      100% { transform: translateY(235px); opacity: 0; }
    }

    @keyframes signal {
      to { stroke-dashoffset: -220; }
    }

    @keyframes roleOne {
      0%, 26% { opacity: 1; transform: translateY(0); }
      31%, 94% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes roleTwo {
      0%, 28% { opacity: 0; transform: translateY(8px); }
      34%, 59% { opacity: 1; transform: translateY(0); }
      65%, 100% { opacity: 0; transform: translateY(-8px); }
    }

    @keyframes roleThree {
      0%, 61% { opacity: 0; transform: translateY(8px); }
      67%, 92% { opacity: 1; transform: translateY(0); }
      98%, 100% { opacity: 0; transform: translateY(-8px); }
    }

    @keyframes terminalOne {
      0%, 12% { opacity: 0; transform: translateX(-8px); }
      18%, 100% { opacity: 1; transform: translateX(0); }
    }

    @keyframes terminalTwo {
      0%, 31% { opacity: 0; transform: translateX(-8px); }
      38%, 100% { opacity: 1; transform: translateX(0); }
    }

    @keyframes terminalThree {
      0%, 51% { opacity: 0; transform: translateX(-8px); }
      58%, 100% { opacity: 1; transform: translateX(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>

  <!-- Background -->

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <circle cx="1080" cy="40" r="260" fill="url(#orangeGlow)"/>
  <circle cx="105" cy="335" r="210" fill="url(#orangeGlow)" opacity=".45"/>

  <!-- Floating decorations -->

  <g class="float-one">
    <circle cx="1090" cy="75" r="7" fill="#FC6E00" filter="url(#glow)"/>
    <circle cx="1124" cy="112" r="3" fill="#FFFFFF" opacity=".55"/>
  </g>

  <g class="float-two">
    <circle cx="679" cy="51" r="4" fill="#FC6E00" opacity=".75"/>
    <circle cx="650" cy="88" r="2.5" fill="#FFFFFF" opacity=".4"/>
  </g>

  <!-- Left content -->

  <g class="sans">
    <g transform="translate(66 47)">
      <rect width="222" height="32" rx="16" fill="#FFFFFF" fill-opacity=".065"/>
      <circle class="pulse" cx="18" cy="16" r="5" fill="#FC6E00"/>
      <text
        x="34"
        y="21"
        fill="#D8E2F2"
        font-size="12"
        font-weight="700"
        letter-spacing="1.5"
      >
        BUILDING FROM CAMBODIA
      </text>
    </g>

